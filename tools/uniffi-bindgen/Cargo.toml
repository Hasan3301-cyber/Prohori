[package]
name = "prohori-uniffi-bindgen"
description = "Generates the Kotlin bindings for prohori-ffi. Build tool only — never shipped."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "uniffi-bindgen"
path = "src/main.rs"

[dependencies]
# A separate crate on purpose. The `cli` feature drags a command-line argument parser in,
# and none of that belongs in the library that ships on a phone with a device budget.
#
# `cargo-metadata` is what lets the generator find `core-ffi/uniffi.toml` from the built
# library. Without it the Kotlin lands in uniffi's default package and the app's imports
# silently do not resolve.
uniffi = { workspace = true, features = ["cli", "cargo-metadata"] }
