org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Android ABIs to build the Rust core for.
#
# arm64-v8a is every phone this app is aimed at that was sold in the last several years.
# armeabi-v7a is here because the target user is not on a new phone — the whole point of
# a 1.5 GB on-device model floor is that the app has to work on hardware someone already
# owns. Add x86_64 locally if you run an emulator:
#
#     ./gradlew assembleDebug -PprohoriAbis=arm64-v8a,x86_64
prohoriAbis=arm64-v8a,armeabi-v7a
